name: Testes

on:
  push:
    branches: [main, master, work/nss-pipeline]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Rodar testes unitários
        run: pytest -m "not integration"

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: situacao_saude_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Rodar testes de integração
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://test_user:test_pass@localhost:5432/situacao_saude_test
        run: pytest -m integration

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validar configuração do Compose
        run: docker compose --profile observability config --quiet

      - name: Validar overlay de produção
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_db_secret_2026
          POSTGRES_DB: situacao_saude
          GRAFANA_ADMIN_USER: ci_admin
          GRAFANA_ADMIN_PASSWORD: ci_grafana_secret_2026
          PROMETHEUS_PUSHGATEWAY_URL: http://pushgateway:9091
        run: docker compose -f docker-compose.yml -f docker-compose.production.yml --profile observability config --quiet

      - name: Executar preflight de produção
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_db_secret_2026
          POSTGRES_DB: situacao_saude
          GRAFANA_ADMIN_USER: ci_admin
          GRAFANA_ADMIN_PASSWORD: ci_grafana_secret_2026
          DATABASE_URL: postgresql+psycopg2://ci_user:ci_db_secret_2026@db:5432/situacao_saude
          PROMETHEUS_PUSHGATEWAY_URL: http://pushgateway:9091
        run: python -m app.pipeline.preflight

      - name: Construir imagens operacionais
        run: docker compose build pipeline migrate

      - name: Subir stack de observabilidade
        run: docker compose --profile observability up -d db prometheus pushgateway grafana

      - name: Aplicar migrations no banco do smoke test
        run: docker compose run --rm migrate

      - name: Validar consultas SQL do dashboard
        run: |
          docker compose exec -T db psql -U nss -d situacao_saude \
            -v ON_ERROR_STOP=1 \
            -c 'SELECT published_at AS time, disease_codigo, ano, batch_id, geographic_scope_type, source_rows, resolved_rows, discarded_rows, aggregation_reduction, invalid_municipality_rows, out_of_scope_rows, uf_mismatch_rows FROM analytics.pipeline_execution_metrics ORDER BY published_at DESC LIMIT 0;' \
            -c 'SELECT published_at AS time, disease_codigo, ano, batch_id, COUNT(*) AS municipalities_published, SUM(groups_total) AS groups_total, SUM(cases_total) AS cases_total, geographic_scope_type FROM analytics.pipeline_publications GROUP BY published_at, disease_codigo, ano, batch_id, geographic_scope_type ORDER BY published_at DESC LIMIT 0;'

      - name: Verificar provisionamento Grafana e Prometheus
        run: |
          trap 'docker compose --profile observability down -v' EXIT
          for url in \
            http://localhost:9090/-/ready \
            http://localhost:9091/-/ready \
            http://localhost:3000/api/health; do
            for attempt in $(seq 1 30); do
              if curl --fail --silent "$url" >/dev/null; then break; fi
              if [ "$attempt" -eq 30 ]; then exit 1; fi
              sleep 2
            done
          done
          curl --fail --silent -u admin:admin \
            http://localhost:3000/api/search \
            | jq -e 'any(.[]; .uid == "nss-pipeline-overview")' >/dev/null
          curl --fail --silent -u admin:admin \
            http://localhost:3000/api/ruler/grafana/api/v1/rules \
            | jq -e '."NSS Pipeline"[0].rules | length == 2' >/dev/null
          for attempt in $(seq 1 30); do
            if curl --fail --silent -u admin:admin \
              http://localhost:3000/api/datasources/uid/nss-postgres/health \
              | jq -e '.status == "OK"' >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 2
          done
