services:
  db:
    ports: !reset []
    volumes: !override
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

  migrate:
    image: ${NSS_DATABASE_IMAGE:?NSS_DATABASE_IMAGE is required}
    environment:
      POSTGRES_ADMIN_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      ANALYTICS_READER_USER: ${NSS_ANALYTICS_READER_USER:?NSS_ANALYTICS_READER_USER is required}
      ANALYTICS_READER_PASSWORD: ${NSS_ANALYTICS_READER_PASSWORD:?NSS_ANALYTICS_READER_PASSWORD is required}
      ANALYTICS_WRITER_USER: ${NSS_ANALYTICS_WRITER_USER:?NSS_ANALYTICS_WRITER_USER is required}
      ANALYTICS_WRITER_PASSWORD: ${NSS_ANALYTICS_WRITER_PASSWORD:?NSS_ANALYTICS_WRITER_PASSWORD is required}
      ANALYTICS_MIGRATOR_USER: ${NSS_ANALYTICS_MIGRATOR_USER:?NSS_ANALYTICS_MIGRATOR_USER is required}
      ANALYTICS_MIGRATOR_PASSWORD: ${NSS_ANALYTICS_MIGRATOR_PASSWORD:?NSS_ANALYTICS_MIGRATOR_PASSWORD is required}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:?GRAFANA_DB_USER is required}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?GRAFANA_DB_PASSWORD is required}

  pipeline:
    image: ${NSS_PIPELINE_IMAGE:?NSS_PIPELINE_IMAGE is required}
    build: !reset null
    volumes: !override
      - pipeline_data:/data
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL do escritor é obrigatória}
      PROMETHEUS_PUSHGATEWAY_URL: ${PROMETHEUS_PUSHGATEWAY_URL:?PROMETHEUS_PUSHGATEWAY_URL is required}

  prometheus:
    ports: !reset []

  pushgateway:
    ports: !reset []

  grafana:
    ports: !reset []
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:?GRAFANA_DB_USER is required}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?GRAFANA_DB_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

volumes:
  pipeline_data:
