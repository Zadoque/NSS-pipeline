apiVersion: 1

datasources:
  - name: Prometheus
    uid: nss-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: NSS PostgreSQL
    uid: nss-postgres
    type: postgres
    access: proxy
    url: db:5432
    user: $__env{POSTGRES_USER}
    jsonData:
      database: $__env{POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $__env{POSTGRES_PASSWORD}
    editable: false
