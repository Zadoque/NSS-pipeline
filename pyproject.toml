[tool.mutmut]
# Escopo inicial de mutação: módulos com maior valor de negócio e testes
# unitários já disponíveis. A lista pode ser ampliada por etapa.
source_paths = ["app"]
# O mutmut reconhece automaticamente ``tests/``, mas precisa também do
# pacote-raiz para importar ``app.pipeline`` a partir da cópia mutada.
also_copy = ["app/__init__.py", "pytest.ini", "territories"]
only_mutate = [
    "app/pipeline/atomic_io.py",
    "app/pipeline/sinan/columns.py",
    "app/pipeline/sinan/source.py",
    "app/pipeline/sinan/bronze.py",
    "app/pipeline/sinan/silver.py",
    "app/pipeline/sinan/gold.py",
    "app/pipeline/load.py",
    "app/pipeline/territory_mapping.py",
    "app/pipeline/esporo/silver.py",
    "app/pipeline/update_sinan.py",
    "app/pipeline/run_cnes.py",
    "app/pipeline/run_load.py",
    "app/pipeline/scope.py",
    "app/pipeline/reference/ibge/catalog.py",
    "app/pipeline/reference/ibge/client.py",
    "app/pipeline/reference/ibge/storage.py",
    "app/pipeline/reference/ibge/validation.py",
    "app/pipeline/reference/ibge/refresh.py",
    "app/pipeline/reference/ibge/historical.py",
]

# Testes de integração ficam fora da primeira rodada para evitar que cada
# mutante reinicialize o PostgreSQL. Eles serão adicionados em uma etapa
# específica de mutação da carga.
pytest_add_cli_args_test_selection = ["--ignore=tests/integration", "-m", "not integration"]
pytest_add_cli_args = ["--override-ini=pythonpath=../mutants"]
